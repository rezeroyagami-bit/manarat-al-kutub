name: Install KITARA package

on:
  workflow_dispatch:
  push:
    paths:
      - 'KITARA_FINAL_UPLOAD.zip'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract KITARA package
        run: |
          rm -rf .tmp_kitara
          mkdir .tmp_kitara
          unzip -o KITARA_FINAL_UPLOAD.zip -d .tmp_kitara

          # Remove workflow files from the extracted package.
          # The existing GitHub workflow must remain unchanged because
          # this GitHub App does not have permission to modify workflows.
          rm -rf .tmp_kitara/.github

          # Copy the application files over the repository.
          cp -a .tmp_kitara/. .

          rm -rf .tmp_kitara
          rm -f KITARA_FINAL_UPLOAD.zip

      - name: Commit installed package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Install KITARA application package" || echo "No changes to commit"
          git push
