name: One-time KITARA magazine fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Exclude issue mirrors from old magazines
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/home_screen.dart')
          text = path.read_text(encoding='utf-8')
          old = "final magazines = results.where((book) => book.isMagazine).toList();"
          new = "final magazines = results.where((book) => book.isMagazine && !book.title.contains(' — العدد')).toList();"
          if old not in text:
              raise SystemExit('Target line was not found; no changes made.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit app fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-old-magazine-issues.yml
          git add lib/screens/home_screen.dart .github/workflows/fix-old-magazine-issues.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix issue mirrors in old magazines"
          git push
