name: Build KITARA Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kitara-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing Android platform
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name kitara .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Check Flutter project
        run: flutter analyze --no-pub

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KITARA-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kitara-build-${{ github.run_number }}
          name: KITARA Android build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
