name: Apply KITARA remote configuration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply remote configuration support
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # main.dart
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace("import 'services/supabase_service.dart';", "import 'services/supabase_service.dart';\nimport 'services/remote_config.dart';")
          s = s.replace("  try {\n    final prefs = await SharedPreferences.getInstance();", "  if (supabaseReady) {\n    await RemoteConfigStore.instance.load(supabaseReady: true);\n  }\n\n  try {\n    final prefs = await SharedPreferences.getInstance();", 1)
          s = s.replace("  ThemeData _theme(Brightness brightness) {\n    const green = Color(0xFF2E7D32);\n    const orange = Color(0xFFF28C28);\n    final accent = isExclusiveTheme ? orange : green;", "  ThemeData _theme(Brightness brightness, KitaraRemoteConfig config) {\n    final accent = isExclusiveTheme ? config.exclusivePrimaryColor : config.freePrimaryColor;")
          s = s.replace("    return MaterialApp(\n      debugShowCheckedModeBanner: false,\n      title: 'KITARA — كِتارا',\n      themeMode: isDarkMode ? ThemeMode.dark : ThemeMode.light,\n      theme: _theme(Brightness.light),\n      darkTheme: _theme(Brightness.dark),\n      home: widget.supabaseReady ? const WelcomeScreen() : const SupabaseErrorScreen(),\n    );", "    return AnimatedBuilder(\n      animation: RemoteConfigStore.instance,\n      builder: (context, _) {\n        final config = RemoteConfigStore.instance.config;\n        return MaterialApp(\n          debugShowCheckedModeBanner: false,\n          title: config.appTitle,\n          themeMode: isDarkMode ? ThemeMode.dark : ThemeMode.light,\n          theme: _theme(Brightness.light, config),\n          darkTheme: _theme(Brightness.dark, config),\n          home: widget.supabaseReady ? const WelcomeScreen() : const SupabaseErrorScreen(),\n        );\n      },\n    );")
          p.write_text(s, encoding='utf-8')

          # app_shell.dart
          p = Path('lib/screens/app_shell.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace("import '../services/ad_block_detector.dart';", "import '../services/ad_block_detector.dart';\nimport '../services/remote_config.dart';")
          s = s.replace("    WidgetsBinding.instance.addObserver(this);\n    _loadExclusiveState();", "    WidgetsBinding.instance.addObserver(this);\n    RemoteConfigStore.instance.addListener(_onRemoteConfigChanged);\n    _loadExclusiveState();")
          s = s.replace("    WidgetsBinding.instance.removeObserver(this);", "    WidgetsBinding.instance.removeObserver(this);\n    RemoteConfigStore.instance.removeListener(_onRemoteConfigChanged);")
          s = s.replace("  @override\n  void didChangeAppLifecycleState(AppLifecycleState state) {", "  void _onRemoteConfigChanged() {\n    if (mounted) setState(() {});\n  }\n\n  @override\n  void didChangeAppLifecycleState(AppLifecycleState state) {")
          s = s.replace("      _revalidateActivation();\n      _checkMaintenance();", "      _revalidateActivation();\n      _checkMaintenance();\n      RemoteConfigStore.instance.load();")
          s = s.replace("    final screens = <Widget>[\n      HomeScreen(books: books, onTheme: widget.onThemeToggle),", "    final config = RemoteConfigStore.instance.config;\n    final screens = <Widget>[\n      HomeScreen(books: books, onTheme: widget.onThemeToggle),")
          s = s.replace("label: 'الرئيسية'", "label: config.navHome")
          s = s.replace("label: 'المكتبة'", "label: config.navLibrary")
          s = s.replace("label: 'المفضلة'", "label: config.navFavorites")
          s = s.replace("label: 'تنزيلاتي'", "label: config.navDownloads")
          s = s.replace("  void _openDownloadsFromMaintenance()", "  void _openDownloadsFromMaintenance()")
          p.write_text(s, encoding='utf-8')

          # home_screen.dart
          p = Path('lib/screens/home_screen.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace("import '../services/supabase_service.dart';", "import '../services/supabase_service.dart';\nimport '../services/remote_config.dart';")
          s = s.replace("    final theme = Theme.of(context);\n    final accent = theme.colorScheme.primary;", "    final config = RemoteConfigStore.instance.config;\n    final theme = Theme.of(context);\n    final accent = theme.colorScheme.primary;")
          s = s.replace("    final magazines = results.where((book) => book.isMagazine && !book.title.contains(' — العدد')).toList();", "    final hiddenOldMagazines = (config.values['hide_from_old_magazines_ids'] ?? '')\n        .split(',')\n        .map((e) => e.trim())\n        .where((e) => e.isNotEmpty)\n        .toSet();\n    final magazines = results.where((book) =>\n        book.isMagazine && !hiddenOldMagazines.contains(book.id)).toList();")
          s = s.replace("title: const Text(\n          'KITARA — كِتارا',", "title: Text(\n          config.appTitle,")
          s = s.replace("tooltip: 'الدعم والشكاوى'", "tooltip: config.supportTooltip")
          s = s.replace("tooltip: 'حول كِتارا'", "tooltip: config.aboutTooltip")
          s = s.replace("'مرحبًا بك في كِتارا'", "config.welcomeTitle")
          s = s.replace("'اقرأ • استكشف • استمتع'", "config.welcomeSubtitle", 1)
          s = s.replace("hintText: 'ابحث عن كتاب أو مجلة أو مؤلف...'", "hintText: config.searchHint")
          s = s.replace("_SectionTitle(title: searchText.isEmpty ? 'تصفح حسب القسم' : 'نتائج البحث')", "_SectionTitle(title: searchText.isEmpty ? config.categoriesTitle : config.searchResultsTitle)")
          s = s.replace("_SectionTitle(title: 'الكتب')", "_SectionTitle(title: config.booksTitle)")
          s = s.replace("_SectionTitle(title: 'المجلات القديمة')", "_SectionTitle(title: config.oldMagazinesTitle)")
          s = s.replace("_SectionTitle(title: 'أحدث المحتوى')", "_SectionTitle(title: config.latestTitle)")
          s = s.replace("return ['الكل', ...values];", "return [config.allCategoryTitle, ...values];")
          s = s.replace("selectedCategory == 'الكل'", "selectedCategory == RemoteConfigStore.instance.config.allCategoryTitle")
          s = s.replace("final books = results.where((book) => !book.isMagazine).toList();", "final books = results.where((book) => !book.isMagazine).toList();")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Seed remote settings
        env:
          SUPABASE_URL: https://gftlkxpzympplwluxmah.supabase.co
        run: |
          echo 'Remote configuration code installed. Existing app_settings values remain authoritative.'

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-remote-config.yml
          git add lib/main.dart lib/screens/app_shell.dart lib/screens/home_screen.dart .github/workflows/apply-remote-config.yml
          git diff --cached --quiet && exit 0
          git commit -m "Make KITARA settings remotely configurable"
          git push
