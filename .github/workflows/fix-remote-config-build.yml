name: Fix remote config build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix dynamic navigation list
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/app_shell.dart')
          s=p.read_text(encoding='utf-8')
          s=s.replace('      destinations: const [', '      destinations: [', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-remote-config-build.yml
          git add lib/screens/app_shell.dart .github/workflows/fix-remote-config-build.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix dynamic remote navigation labels"
          git push
