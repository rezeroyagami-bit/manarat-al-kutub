name: Finalize KITARA remote config

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: kitara-remote-config-finalize
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final remote config patches
        shell: bash
        run: |
          set -e
          git fetch origin main
          git reset --hard origin/main

          python3 - <<'PY'
          from pathlib import Path

          # Remove temporary one-shot workflows so they cannot fight future changes.
          for name in [
              'fix-old-magazine-issues.yml',
              'apply-remote-config.yml',
              'fix-remote-config-build.yml',
              'finalize-remote-config.yml',
              'remote-config-finalize.yml',
          ]:
              Path('.github/workflows', name).unlink(missing_ok=True)

          p = Path('lib/screens/app_shell.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace("    const green = Color(0xFF2E7D32);\n    const orange = Color(0xFFF28C28);\n    final accent = exclusiveUnlocked ? orange : green;", "    final config = RemoteConfigStore.instance.config;\n    final accent = exclusiveUnlocked ? config.exclusivePrimaryColor : config.freePrimaryColor;")
          s = s.replace('      destinations: const [', '      destinations: [', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('lib/widgets/kitara_status_bar.dart')
          s = p.read_text(encoding='utf-8')
          if "import '../services/remote_config.dart';" not in s:
              s = s.replace("import '../services/supabase_service.dart';", "import '../services/supabase_service.dart';\nimport '../services/remote_config.dart';")
          s = s.replace("'للوصول إلى المحتوى الحصري والمدفوع أدخل الكود.'", "RemoteConfigStore.instance.config.freeActivationMessage")
          s = s.replace("    const green = Color(0xFF2E7D32);\n    const orange = Color(0xFFF28C28);\n    final accent = widget.exclusiveUnlocked ? orange : green;", "    final config = RemoteConfigStore.instance.config;\n    final accent = widget.exclusiveUnlocked ? config.exclusivePrimaryColor : config.freePrimaryColor;")
          s = s.replace("widget.exclusiveUnlocked ? 'المحتوى الحصري' : 'النسخة المجانية'", "widget.exclusiveUnlocked ? config.exclusiveStatusText : config.freeStatusText")
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/app_shell.dart lib/widgets/kitara_status_bar.dart .github/workflows
          git diff --cached --quiet && exit 0
          git commit -m "Finalize KITARA remote configuration"
          git push origin HEAD:main
