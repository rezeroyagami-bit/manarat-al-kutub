name: Build KITARA Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create Android project
        run: flutter create . --platforms=android

      - name: Install Android NDK
        shell: bash
        run: |
          set -e

          echo "Android SDK: $ANDROID_SDK_ROOT"

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager" ]; then
              SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager"
            else
              echo "ERROR: sdkmanager not found"
              exit 1
            fi
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          NDK_VERSION="27.0.12077973"
          NDK_PATH="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"

          echo "Installing NDK $NDK_VERSION"

          for attempt in 1 2 3; do
            echo "NDK installation attempt: $attempt"

            rm -rf "$NDK_PATH"

            if "$SDKMANAGER" --install "ndk;$NDK_VERSION"; then
              if [ -f "$NDK_PATH/source.properties" ]; then
                echo "NDK $NDK_VERSION installed successfully."
                break
              fi
            fi

            echo "NDK installation failed. Retrying..."
            rm -rf "$NDK_PATH"
            sleep 10

            if [ "$attempt" = "3" ]; then
              echo "ERROR: Failed to install NDK $NDK_VERSION"
              exit 1
            fi
          done

          echo "Installed NDK contents:"
          ls -la "$NDK_PATH"

      - name: Download Amiri font
        run: |
          mkdir -p assets/fonts

          curl -L \
            "https://raw.githubusercontent.com/aliftype/amiri/1.003/fonts/Amiri-Regular.ttf" \
            -o assets/fonts/amiri-regular.ttf

          curl -L \
            "https://raw.githubusercontent.com/aliftype/amiri/1.003/fonts/Amiri-Bold.ttf" \
            -o assets/fonts/amiri-bold.ttf

      - name: Configure Android app
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")

          # Internet permission
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if permission not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    '
                  + permission
              )

          # KITARA app name
          s = re.sub(
              r'android:label="[^"]*"',
              'android:label="KITARA — كِتارا"',
              s,
              count=1
          )

          # AdMob App ID
          admob_metadata = '''
              <meta-data
                  android:name="com.google.android.gms.ads.APPLICATION_ID"
                  android:value="ca-app-pub-6792981270949925~9173891785"/>
          '''

          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              s = s.replace(
                  '</application>',
                  admob_metadata + '\n    </application>',
                  1
              )

          p.write_text(s, encoding="utf-8")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Generate KITARA app icon
        run: dart run flutter_launcher_icons

      - name: Build KITARA APK
        run: flutter build apk --release

      - name: Upload KITARA APK
        uses: actions/upload-artifact@v4
        with:
          name: kitara-apk
          path: build/app/outputs/flutter-apk/app-release.apk
