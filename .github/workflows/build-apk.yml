name: Build KITARA Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create Android project
        run: flutter create . --platforms=android

      - name: Configure Android app
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")

          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if permission not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission
              )

          s = re.sub(
              r'android:label="[^"]*"',
              'android:label="KITARA — كيتارا"',
              s,
              count=1
          )

          p.write_text(s, encoding="utf-8")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Generate KITARA app icon
        run: dart run flutter_launcher_icons

      - name: Build KITARA APK
        run: flutter build apk --release

      - name: Upload KITARA APK
        uses: actions/upload-artifact@v4
        with:
          name: kitara-apk
          path: build/app/outputs/flutter-apk/app-release.apk
