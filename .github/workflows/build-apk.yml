name: Build KITARA Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create Android project
        run: flutter create . --platforms=android

      - name: Install Android NDK
        shell: bash
        run: |
          set -e
          echo "Android SDK: $ANDROID_SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager";
            elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager" ]; then SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager";
            else echo "ERROR: sdkmanager not found"; exit 1; fi
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          NDK_VERSION="27.0.12077973"
          NDK_PATH="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          for attempt in 1 2 3; do
            rm -rf "$NDK_PATH"
            if "$SDKMANAGER" --install "ndk;$NDK_VERSION" && [ -f "$NDK_PATH/source.properties" ]; then break; fi
            rm -rf "$NDK_PATH"; sleep 10
            if [ "$attempt" = "3" ]; then echo "ERROR: Failed to install NDK $NDK_VERSION"; exit 1; fi
          done

      - name: Download Amiri font
        run: |
          mkdir -p assets/fonts
          curl -L "https://raw.githubusercontent.com/aliftype/amiri/1.003/fonts/Amiri-Regular.ttf" -o assets/fonts/amiri-regular.ttf
          curl -L "https://raw.githubusercontent.com/aliftype/amiri/1.003/fonts/Amiri-Bold.ttf" -o assets/fonts/amiri-bold.ttf

      - name: Configure Android app
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in s:
              s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission)
          s = re.sub(r'android:label="[^"]*"', 'android:label="KITARA — كِتارا"', s, count=1)
          admob_metadata = '''
              <meta-data
                  android:name="com.google.android.gms.ads.APPLICATION_ID"
                  android:value="ca-app-pub-6792981270949925~9173891785"/>
          '''
          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              s = s.replace('</application>', admob_metadata + '\n    </application>', 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Generate KITARA app icon
        run: dart run flutter_launcher_icons

      - name: Repair HomeScreen syntax and persist the fix
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('lib/screens/home_screen.dart')
          s = p.read_text(encoding='utf-8')
          replacement = '''class _EmptyState extends StatelessWidget {
            final bool hasSearch;
            final Color accent;

            const _EmptyState({required this.hasSearch, required this.accent});

            @override
            Widget build(BuildContext context) {
              return Center(
                child: Padding(
                  padding: const EdgeInsets.all(30),
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Icon(
                        hasSearch ? Icons.search_off_rounded : Icons.menu_book_rounded,
                        size: 54,
                        color: accent,
                      ),
                      const SizedBox(height: 14),
                      Text(
                        hasSearch ? 'لا توجد نتائج مطابقة.' : 'لا يوجد محتوى متاح حاليًا.',
                        textAlign: TextAlign.center,
                        style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          '''
          s2, n = re.subn(r'class _EmptyState extends StatelessWidget \{.*\Z', replacement, s, flags=re.S)
          if n:
              p.write_text(s2, encoding='utf-8')
          PY
          if ! git diff --quiet -- lib/screens/home_screen.dart; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add lib/screens/home_screen.dart
            git commit -m 'Fix HomeScreen empty state syntax'
            git push
          fi

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build KITARA APK
        run: flutter build apk --release

      - name: Upload KITARA APK
        uses: actions/upload-artifact@v4
        with:
          name: kitara-apk
          path: build/app/outputs/flutter-apk/app-release.apk
