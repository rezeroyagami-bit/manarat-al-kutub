name: Finish KITARA remote sections

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply remote section switches
        shell: bash
        run: |
          set -e
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path

          p=Path('lib/screens/home_screen.dart')
          s=p.read_text(encoding='utf-8')
          s=s.replace("final magazines = results.where((book) =>\n        book.isMagazine && !hiddenOldMagazines.contains(book.id)).toList();", "final magazines = results.where((book) =>\n        book.isMagazine && !hiddenOldMagazines.contains(book.id)).toList();")
          s=s.replace("_NewsTicker(items: _newsItems, accent: accent)", "_NewsTicker(items: _newsItems, accent: config.newsColor)")
          s=s.replace("decoration: BoxDecoration(color: const Color(0xFFC62828), borderRadius: BorderRadius.circular(7))", "decoration: BoxDecoration(color: widget.accent, borderRadius: BorderRadius.circular(7))")
          p.write_text(s, encoding='utf-8')

          p=Path('lib/main.dart')
          s=p.read_text(encoding='utf-8')
          s=s.replace("    const green = Color(0xFF2E7D32);\n    return Scaffold(\n      backgroundColor: Colors.white,", "    final config = RemoteConfigStore.instance.config;\n    final green = config.freePrimaryColor;\n    return Scaffold(\n      backgroundColor: Colors.white,", 1)
          s=s.replace("const Text('KITARA', style: TextStyle(fontFamily: 'Amiri', fontSize: 38, fontWeight: FontWeight.bold, color: green, letterSpacing: 2))", "Text('KITARA', style: TextStyle(fontFamily: 'Amiri', fontSize: 38, fontWeight: FontWeight.bold, color: green, letterSpacing: 2))")
          s=s.replace("const Text('كِتارا', style: TextStyle(fontFamily: 'Amiri', fontSize: 28, fontWeight: FontWeight.w700))", "Text(config.brandArabic, style: const TextStyle(fontFamily: 'Amiri', fontSize: 28, fontWeight: FontWeight.w700))")
          s=s.replace("const Text('رحلة الكتاب تبدأ بصفحة', textAlign: TextAlign.center, style: TextStyle(fontFamily: 'Amiri', fontSize: 20, fontWeight: FontWeight.w600, color: Colors.black87))", "Text(config.introTitle, textAlign: TextAlign.center, style: const TextStyle(fontFamily: 'Amiri', fontSize: 20, fontWeight: FontWeight.w600, color: Colors.black87))")
          s=s.replace("const Text('اقرأ • استكشف • استمتع', textAlign: TextAlign.center, style: TextStyle(fontFamily: 'Amiri', fontSize: 16, color: Colors.black54))", "Text(config.introSubtitle, textAlign: TextAlign.center, style: const TextStyle(fontFamily: 'Amiri', fontSize: 16, color: Colors.black54))")
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/remote-config-sections.yml
          git add lib/screens/home_screen.dart lib/main.dart .github/workflows
          git diff --cached --quiet && exit 0
          git commit -m "Extend KITARA remote configuration"
          git push origin HEAD:main
