name: Build KITARA Control

on:
  push:
    paths:
      - 'admin/**'
      - '.github/workflows/build-admin.yml'
  workflow_dispatch:

jobs:
  build-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package.json
      - name: Install dependencies
        run: npm install
      - name: Build KITARA Control
        run: npm run build
