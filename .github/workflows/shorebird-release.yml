name: Shorebird Release KITARA Android

on:
  push:
    branches:
      - kitara/combined-updates
    paths:
      - .github/workflows/shorebird-release.yml
      - lib/**
      - pubspec.yaml
      - pubspec.lock
      - assets/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: false

      - name: Set up Flutter for Android project generation
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable

      - name: Verify required secrets
        env:
          KITARA_KEYSTORE_BASE64: ${{ secrets.KITARA_KEYSTORE_BASE64 }}
          KITARA_KEYSTORE_PASSWORD: ${{ secrets.KITARA_KEYSTORE_PASSWORD }}
          KITARA_KEY_PASSWORD: ${{ secrets.KITARA_KEY_PASSWORD }}
          KITARA_KEY_ALIAS: ${{ secrets.KITARA_KEY_ALIAS }}
        run: |
          set -e
          test -n "$SHOREBIRD_TOKEN" || { echo "SHOREBIRD_TOKEN is missing"; exit 1; }
          test -n "$KITARA_KEYSTORE_BASE64" || { echo "KITARA_KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$KITARA_KEYSTORE_PASSWORD" || { echo "KITARA_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$KITARA_KEY_PASSWORD" || { echo "KITARA_KEY_PASSWORD is missing"; exit 1; }
          test -n "$KITARA_KEY_ALIAS" || { echo "KITARA_KEY_ALIAS is missing"; exit 1; }

      - name: Generate Android project
        run: flutter create . --platforms=android

      - name: Configure Android app and compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml was not generated")
          s = manifest.read_text(encoding="utf-8")
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          if marker not in s:
              raise SystemExit("Unexpected Android manifest format")
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in s:
              s = s.replace(marker, marker + "\\n    " + permission, 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="KITARA — كِتارا"', s, count=1)
          manifest.write_text(s, encoding="utf-8")

          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("No Android app Gradle file was generated")
          g = gradle.read_text(encoding="utf-8")
          patterns = [
              (r'(?m)^(\\s*compileSdk\\s*=\\s*).*$', r'\\g<1>36'),
              (r'(?m)^(\\s*compileSdkVersion\\s+).*$', r'\\g<1>36'),
              (r'(?m)^(\\s*compileSdk\\s+).*$', r'\\g<1>36'),
          ]
          count = 0
          for pattern, replacement in patterns:
              g, count = re.subn(pattern, replacement, g, count=1)
              if count:
                  break
          if not count:
              print(g)
              raise SystemExit("Could not locate compileSdk declaration in " + str(gradle))
          gradle.write_text(g, encoding="utf-8")
          print(f"Configured {gradle} with compile SDK 36")
          PY

      - name: Show generated Android config
        run: |
          grep -nE "applicationId|namespace|compileSdk|minSdk|targetSdk" android/app/build.gradle.kts || true
          grep -n "uses-permission\\|android:label" android/app/src/main/AndroidManifest.xml || true

      - name: Download Amiri fonts
        run: |
          set -e
          mkdir -p assets/fonts
          curl -fL "https://raw.githubusercontent.com/aliftype/amiri/1.003/fonts/Amiri-Regular.ttf" -o assets/fonts/amiri-regular.ttf \\
            || curl -fL "https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Regular.ttf" -o assets/fonts/amiri-regular.ttf
          curl -fL "https://raw.githubusercontent.com/aliftype/amiri/1.003/fonts/Amiri-Bold.ttf" -o assets/fonts/amiri-bold.ttf \\
            || curl -fL "https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Bold.ttf" -o assets/fonts/amiri-bold.ttf

      - name: Install dependencies and generate icon
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Analyze Dart
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Create Shorebird Android release APK
        run: |
          shorebird release android --artifact apk --flutter-version=3.47.9 --build-name "1.0.${GITHUB_RUN_NUMBER}" --build-number "${GITHUB_RUN_NUMBER}"

      - name: Sign APK with KITARA signing key
        env:
          KITARA_KEYSTORE_BASE64: ${{ secrets.KITARA_KEYSTORE_BASE64 }}
          KITARA_KEYSTORE_PASSWORD: ${{ secrets.KITARA_KEYSTORE_PASSWORD }}
          KITARA_KEY_ALIAS: ${{ secrets.KITARA_KEY_ALIAS }}
          KITARA_KEY_PASSWORD: ${{ secrets.KITARA_KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/kitara-signing"
          echo "$KITARA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kitara-signing/kitara.jks"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/kitara-signing/kitara.jks" --ks-key-alias "$KITARA_KEY_ALIAS" --ks-pass "pass:$KITARA_KEYSTORE_PASSWORD" --key-pass "pass:$KITARA_KEY_PASSWORD" "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          rm -f "$RUNNER_TEMP/kitara-signing/kitara.jks"

      - name: Upload Shorebird APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitara-shorebird-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Shorebird APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp build/app/outputs/flutter-apk/app-release.apk kitara-shorebird.apk
          TAG="shorebird-v${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" kitara-shorebird.apk --title "كِتارا Shorebird $TAG" --generate-notes
