name: Shorebird Release KITARA Android

on:
  push:
    branches:
      - kitara/combined-updates
    paths:
      - .github/workflows/shorebird-release.yml
      - lib/**
      - pubspec.yaml
      - pubspec.lock
      - assets/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: false

      - name: Verify signing secrets
        env:
          KITARA_KEYSTORE_BASE64: ${{ secrets.KITARA_KEYSTORE_BASE64 }}
          KITARA_KEYSTORE_PASSWORD: ${{ secrets.KITARA_KEYSTORE_PASSWORD }}
          KITARA_KEY_PASSWORD: ${{ secrets.KITARA_KEY_PASSWORD }}
          KITARA_KEY_ALIAS: ${{ secrets.KITARA_KEY_ALIAS }}
        run: |
          test -n "$SHOREBIRD_TOKEN" || { echo "SHOREBIRD_TOKEN is missing"; exit 1; }
          test -n "$KITARA_KEYSTORE_BASE64" || { echo "KITARA_KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$KITARA_KEYSTORE_PASSWORD" || { echo "KITARA_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$KITARA_KEY_PASSWORD" || { echo "KITARA_KEY_PASSWORD is missing"; exit 1; }
          test -n "$KITARA_KEY_ALIAS" || { echo "KITARA_KEY_ALIAS is missing"; exit 1; }

      - name: Set up Flutter for Android project generation
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable

      - name: Generate Android project
        run: flutter create . --platforms=android

      - name: Configure Android app
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          install_permission = '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>'
          manifest_open = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          if permission not in s:
              s = s.replace(manifest_open, manifest_open + '\n    ' + permission)
          if install_permission not in s:
              s = s.replace(permission, permission + '\n    ' + install_permission)
          s = re.sub(r'android:label="[^"]*"', 'android:label="KITARA — كِتارا"', s, count=1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Download Amiri fonts
        run: |
          mkdir -p assets/fonts
          curl -fL "https://raw.githubusercontent.com/aliftype/amiri/1.003/fonts/Amiri-Regular.ttf" -o assets/fonts/amiri-regular.ttf
          curl -fL "https://raw.githubusercontent.com/aliftype/amiri/1.003/fonts/Amiri-Bold.ttf" -o assets/fonts/amiri-bold.ttf

      - name: Install dependencies and generate icon
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Analyze Dart
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Create Shorebird Android release APK
        run: |
          shorebird release android --artifact apk --flutter-version=3.47.9 --build-name "1.0.${GITHUB_RUN_NUMBER}" --build-number "${GITHUB_RUN_NUMBER}"

      - name: Sign APK with KITARA's existing signing key
        env:
          KITARA_KEYSTORE_BASE64: ${{ secrets.KITARA_KEYSTORE_BASE64 }}
          KITARA_KEYSTORE_PASSWORD: ${{ secrets.KITARA_KEYSTORE_PASSWORD }}
          KITARA_KEY_PASSWORD: ${{ secrets.KITARA_KEY_PASSWORD }}
          KITARA_KEY_ALIAS: ${{ secrets.KITARA_KEY_ALIAS }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/kitara-signing"
          echo "$KITARA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kitara-signing/kitara.jks"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/kitara-signing/kitara.jks" --ks-key-alias "$KITARA_KEY_ALIAS" --ks-pass "pass:$KITARA_KEYSTORE_PASSWORD" --key-pass "pass:$KITARA_KEY_PASSWORD" "$APK"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload Shorebird APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitara-shorebird-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Publish Shorebird APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk kitara-shorebird.apk
          TAG="shorebird-v${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" kitara-shorebird.apk --title "كِتارا Shorebird $TAG" --generate-notes
